[package]
name = "sanctum-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["ffi-cli"]

[features]
ffi = ["dep:uniffi"]
ffi-cli = ["ffi", "uniffi/cli"]

[dependencies]
# Mobile bindings (Swift/Kotlin) over the same core.
uniffi = { version = "0.29", optional = true }
# Staged for v2 envelopes: libsignal PQXDH + double ratchet (official Signal
# crates; git-only, Signal does not publish to crates.io). Needs `protoc`.
# The v2 session module is not implemented yet; envelopes are v1 below.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.4" }
futures-executor = "0.3"
# v1 envelopes: X25519 + XSalsa20-Poly1305 (audited RustCrypto). Ceiling: no
# forward secrecy / PQ; the envelope version byte exists for the v2 swap.
crypto_box = { version = "0.9", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusty-s3 = "0.8"
ureq = { version = "2", features = ["socks-proxy", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ulid = "1"
thiserror = "2"
percent-encoding = "2"
# Encrypted local history: SQLCipher (same at-rest stack as Signal/SimpleX),
# DB key held in the OS keychain, never on disk.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["apple-native"] }

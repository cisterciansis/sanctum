[package]
name = "sanctum-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["ffi-cli"]

[features]
ffi = ["dep:uniffi"]
ffi-cli = ["ffi", "uniffi/cli"]
# Embedded Tor (Arti) for platforms with no Tor daemon to point at (iOS).
# Adds ~13 MB, so only the iOS build turns it on.
tor = ["dep:arti-client", "tokio/net", "tokio/io-util", "dep:libc"]

[dependencies]
# Mobile bindings (Swift/Kotlin) over the same core.
uniffi = { version = "0.29", optional = true }
# v2 envelopes: libsignal PQXDH + double ratchet (official Signal
# crates; git-only, Signal does not publish to crates.io). Needs `protoc`.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.105.4" }
futures-executor = "0.3"
# libsignal's RNG traits (already in the tree via libsignal).
rand = "0.9"
# v1 envelopes: X25519 + XSalsa20-Poly1305 (audited RustCrypto). Kept to read
# pre-v2 chats and for groups; no forward secrecy / PQ.
crypto_box = { version = "0.9", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusty-s3 = "0.8"
ureq = { version = "2", features = ["socks-proxy", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Mesh tags/acks/dedup (already in the tree via libsignal).
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ulid = "1"
thiserror = "2"
percent-encoding = "2"
# Encrypted local history: SQLCipher (same at-rest stack as Signal/SimpleX),
# DB key held in the OS keychain, never on disk.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["apple-native"] }
# TAO (Bittensor) wallet: Substrate client without its websocket transport;
# chain RPC goes over our own HTTP agent so Tor/proxy settings cover it.
subxt = { version = "0.51", default-features = false, features = ["native", "runtime"] }
subxt-signer = { version = "0.51", default-features = false, features = ["sr25519", "unstable-eth", "subxt", "std"] }
# Private payments: stealth addresses from schnorrkel's own key exchange and
# soft derivation (already in the tree via subxt-signer), and MEV Shield
# encryption with the same crates Bittensor's runtime decrypts with.
schnorrkel = { version = "0.11", features = ["aead"] }
merlin = "3"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sp-crypto-hashing = "0.1"
ml-kem = "0.2.2"
chacha20poly1305 = "0.10"
arti-client = { version = "0.47", optional = true, default-features = false, features = ["tokio", "native-tls", "compression"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# Pin only: sysinfo 0.38 (via arti's tor-memquota) fails to build for iOS
# once libc makes proc_fdinfo macOS-only (0.2.191). Drop with a fixed sysinfo.
libc = { version = "0.2, <0.2.190", optional = true }
